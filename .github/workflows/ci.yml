# Copy this file to `.github/workflows/ci.yml` inside whichever repo you
# want the dashboard to track — NOT into this backend's own repo.
# It just needs to exist and run; its only job here is to give your
# webhook something real to react to.
#
# actions/checkout@v6 and actions/setup-node@v6 are the current major
# versions as of mid-2026 and both run on the Node 24 runtime.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --if-present

      - name: Run build
        run: npm run build --if-present

      - name: Run tests
        run: npm test --if-present
